[workspace]
members = [
    "crates/discord_bot",
    "crates/deflate_coder",
    "crates/gaussian_packing",
    "crates/gaussian_parser",
    "crates/gaussian_sorter",
    "crates/gaussian_types",
    "pipeline/vpcc_encoder",
    "pipeline/vpcc_decoder",
    "pipeline/tmc2_adapter",
]
resolver = "2"

[workspace.dependencies]
gaussian_types = { path = "crates/gaussian_types" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
