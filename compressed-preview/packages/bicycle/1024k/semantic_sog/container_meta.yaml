          min_values: [-0.4020090699195862]
          max_values: [0.38570940494537354]
          dim: 2
          dtype: float32
          round_to_int: false
  - input_fields: [f_rest_labels, f_rest_centroids]
    transforms:
      - lookup:
          labels: f_rest_labels
          table: f_rest_centroids
          to_field: f_rest
  - input_fields: [f_rest]
    transforms:
      - reshape:
          start_dim: 1
