          dtype: float32
          round_to_int: false
      - remapping:
          method: exp
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [quaternions]
    transforms:
      - simple_quantize:
          min_values: [0.031062589958310127, -0.7478018999099731, -0.7310996055603027,
