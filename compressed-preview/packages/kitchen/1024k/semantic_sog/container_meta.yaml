          type: image
          image_codec: avif
          field_name: f_rest_centroids
  - input_fields: [f_rest_centroids]
    transforms:
      - reshape:
          shape: [3, 256, 5, 256, 3]
      - permute:
          dims: [1, 3, 4, 0, 2]
      - reshape:
          shape: [65536, 45]
  - input_fields: []
    transforms:
      - read_file:
          file_path: opacities.avif
          type: image
          image_codec: avif
          field_name: opacities
      - read_file:
          file_path: scales.avif
          type: image
          image_codec: avif
          field_name: scales
      - read_file:
          file_path: means_bytes_0.avif
          type: image
          image_codec: avif
          field_name: means_bytes_0
      - read_file:
          file_path: means_bytes_1.avif
          type: image
          image_codec: avif
          field_name: means_bytes_1
      - read_file:
          file_path: quaternions.avif
          type: image
          image_codec: avif
          field_name: quaternions
      - read_file:
          file_path: f_dc.avif
          type: image
          image_codec: avif
          field_name: f_dc
      - read_file:
          file_path: f_rest_labels_bytes_0.avif
          type: image
          image_codec: avif
          field_name: f_rest_labels_bytes_0
      - read_file:
          file_path: f_rest_labels_bytes_1.avif
          type: image
          image_codec: avif
          field_name: f_rest_labels_bytes_1
  - input_fields: [opacities]
    transforms:
      - simple_quantize:
          min_values: [-5.574482440948486]
          max_values: [7.767963886260986]
          dim: 2
          dtype: float32
          round_to_int: false
      - remapping:
          method: sigmoid
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [scales]
    transforms:
      - simple_quantize:
          min_values: [-10.296330451965332, -11.284607887268066, -11.11102294921875]
          max_values: [1.5542494058609009, 1.4031403064727783, 1.239837408065796]
