    transforms:
      - combine:
          method: bytes
          to_field: f_rest_labels
  - input_fields: [f_rest_labels]
    transforms:
      - simple_quantize:
          min_values: [0]
          max_values: [65535]
          dim: 2
          dtype: float32
          round_to_int: false
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [f_rest_centroids]
    transforms:
      - simple_quantize:
          min_values: [-0.3564050793647766]
          max_values: [0.2971822917461395]
          dim: 2
          dtype: float32
          round_to_int: false
  - input_fields: [f_rest_labels, f_rest_centroids]
    transforms:
      - lookup:
          labels: f_rest_labels
          table: f_rest_centroids
          to_field: f_rest
  - input_fields: [f_rest]
    transforms:
      - reshape:
          start_dim: 1
          shape: [3, 15]
      - permute:
          dims: [0, 2, 1]
  - input_fields: [f_dc]
    transforms:
      - flatten:
          start_dim: 0
          end_dim: 1
      - simple_quantize:
          min_values: [-2.2779345512390137, -2.3379018306732178, -2.470303773880005]
          max_values: [7.902455806732178, 6.116921901702881, 7.117130279541016]
          dim: 1
          dtype: float32
          round_to_int: false
      - reshape:
          start_dim: 1
          shape: [1, 3]
  - input_fields: [means_bytes_1]
    transforms:
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [means_bytes_0]
    transforms:
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [means_bytes_0, means_bytes_1]
    transforms:
      - combine:
          method: bytes
          to_field: means
  - input_fields: [means]
    transforms:
      - simple_quantize:
          min_values: [-3.444382667541504]
          max_values: [3.714299440383911]
          dim: 2
          dtype: float32
          round_to_int: false
      - remapping:
          method: signed-exp
  - input_fields: [f_dc, f_rest]
    transforms:
      - combine:
          method: concat
          dim: 1
          to_field: sh
scene:
  primitives: 3DGS-INRIA
  params: [means, scales, opacities, quaternions, sh]
