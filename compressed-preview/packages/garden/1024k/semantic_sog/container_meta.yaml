      - simple_quantize:
          min_values: [-0.43113553524017334]
          max_values: [0.3756389021873474]
          dim: 2
          dtype: float32
          round_to_int: false
  - input_fields: [f_rest_labels, f_rest_centroids]
    transforms:
      - lookup:
          labels: f_rest_labels
          table: f_rest_centroids
          to_field: f_rest
  - input_fields: [f_rest]
    transforms:
      - reshape:
          start_dim: 1
