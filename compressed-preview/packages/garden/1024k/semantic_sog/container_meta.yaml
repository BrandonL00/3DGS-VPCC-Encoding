          max_values: [4.0645270347595215]
          dim: 2
          dtype: float32
          round_to_int: false
      - remapping:
          method: signed-exp
  - input_fields: [f_dc, f_rest]
    transforms:
      - combine:
          method: concat
          dim: 1
          to_field: sh
scene:
  primitives: 3DGS-INRIA
  params: [means, scales, opacities, quaternions, sh]
