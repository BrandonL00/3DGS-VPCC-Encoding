          dtype: float32
          round_to_int: false
      - remapping:
          method: exp
      - flatten:
          start_dim: 0
          end_dim: 1
  - input_fields: [quaternions]
    transforms:
      - simple_quantize:
          min_values: [-0.06975828856229782, -0.9515917301177979, -0.946969747543335,
