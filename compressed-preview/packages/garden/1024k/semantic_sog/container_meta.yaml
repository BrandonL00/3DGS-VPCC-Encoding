    transforms:
      - reshape:
          shape: [3, 256, 5, 256, 3]
      - permute:
          dims: [1, 3, 4, 0, 2]
      - reshape:
          shape: [65536, 45]
  - input_fields: []
    transforms:
      - read_file:
          file_path: opacities.avif
          type: image
          image_codec: avif
          field_name: opacities
      - read_file:
          file_path: scales.avif
          type: image
          image_codec: avif
          field_name: scales
      - read_file:
          file_path: means_bytes_0.avif
          type: image
          image_codec: avif
          field_name: means_bytes_0
      - read_file:
          file_path: means_bytes_1.avif
          type: image
          image_codec: avif
          field_name: means_bytes_1
      - read_file:
          file_path: quaternions.avif
          type: image
          image_codec: avif
          field_name: quaternions
      - read_file:
          file_path: f_dc.avif
          type: image
          image_codec: avif
          field_name: f_dc
