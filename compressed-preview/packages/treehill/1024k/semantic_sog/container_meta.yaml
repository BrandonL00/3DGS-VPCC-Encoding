          image_codec: avif
          field_name: means_bytes_1
      - read_file:
          file_path: quaternions.avif
          type: image
          image_codec: avif
          field_name: quaternions
      - read_file:
          file_path: f_dc.avif
          type: image
          image_codec: avif
          field_name: f_dc
